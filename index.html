<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14804a">
<title>Minha Lista de Mercado</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercado">
<style>
:root{--g:#14804a;--g2:#0f6b3d;--gl:#e7f5ec;--bg:#f5f6f4;--card:#fff;--tx:#1d2420;--mu:#68736c;--bd:#e2e6e3;--red:#c6372f;--redl:#fdecea;--yel:#b7791f;--yell:#fdf4e3;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#121513;--card:#1c211e;--tx:#e9eee9;--mu:#9aa59e;--bd:#2c332f;--gl:#16301f;--redl:#3a1d1b;--yell:#3a2f17}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 2px 9px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--g);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mu{color:var(--mu);font-size:14px}
.sm{font-size:13px}
h2{font-size:17px;margin:18px 4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;background:var(--g);color:#fff;min-height:46px}
.btn.sec{background:var(--gl);color:var(--g)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.danger{background:var(--redl);color:var(--red)}
.btn.full{width:100%}
.btn:active{filter:brightness(.92)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;text-align:left;color:var(--tx);font-size:15px}
.tile .i{font-size:26px;display:block;margin-bottom:6px}
.tile b{display:block;font-size:16px}
.stat{font-size:24px;font-weight:800;color:var(--g)}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
.list{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:0}
.li.done .nm{text-decoration:line-through;color:var(--mu)}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.b-ok{background:var(--gl);color:var(--g)}.b-low{background:var(--yell);color:var(--yel)}.b-out{background:var(--redl);color:var(--red)}
.step{display:flex;align-items:center;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.step button{width:38px;height:38px;border:0;background:var(--gl);color:var(--g);font-size:20px;font-weight:700}
.step span,.step input{min-width:44px;width:52px;text-align:center;font-weight:700;border:0;padding:0;border-radius:0}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--bd);background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.chk.on{background:var(--g);border-color:var(--g)}
.price{width:96px;text-align:right;padding:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.totbar{position:sticky;top:calc(env(safe-area-inset-top) + 58px);z-index:4;background:var(--g2);color:#fff;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;gap:10px}
.totbar div{flex:1}.totbar small{display:block;opacity:.8;font-size:12px}.totbar b{font-size:19px}
.empty{text-align:center;color:var(--mu);padding:28px 12px}
.empty .i{font-size:40px;display:block;margin-bottom:8px}
.ic{background:none;border:0;font-size:20px;padding:6px;color:var(--mu)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:2px 0 10px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:15px;max-width:90%;text-align:center}
.warn{background:var(--yell);color:var(--yel);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.big{font-size:34px;font-weight:800;color:var(--g);margin:4px 0}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}
.neg{color:var(--red)}.pos{color:var(--g)}
.scanbox{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;left:8%;right:8%;top:25%;bottom:25%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d;animation:sl 1.6s ease-in-out infinite}
@keyframes sl{0%,100%{transform:translateY(-38px)}50%{transform:translateY(38px)}}
.okbox{background:var(--gl);color:var(--g);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:6px}
.catH{font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:14px 4px 6px}
</style>
</head>
<body>
<header><button id="back" hidden>‹</button><h1 id="title">Mercado</h1><span id="hAct"></span></header>
<main id="app"></main>
<nav id="nav">
 <button data-go="home"><span class="i">🏠</span>Início</button>
 <button data-go="lists"><span class="i">📝</span>Listas</button>
 <button data-go="pantry"><span class="i">🏡</span>Em casa</button>
 <button data-go="items"><span class="i">🥫</span>Itens</button>
 <button data-go="history"><span class="i">🧾</span>Compras</button>
</nav>
<div id="layer"></div>
<script>
"use strict";
const KEY="mercado.v1";
const UNITS=["un","kg","g","L","ml","pct","cx","dz","lata","garrafa"];
const DEF_CATS=["Hortifruti","Açougue","Padaria","Laticínios","Mercearia","Bebidas","Limpeza","Higiene","Congelados","Outros"];
let S,storageOK=true;
function blank(){return{v:1,items:[],lists:[],history:[],cats:DEF_CATS.slice(),seeded:false}}
function load(){
  try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):blank()}catch(e){storageOK=false;S=blank()}
  S.items=S.items||[];S.lists=S.lists||[];S.history=S.history||[];S.cats=S.cats&&S.cats.length?S.cats:DEF_CATS.slice();
  if(!S.seeded&&!S.items.length){seed();S.seeded=true;save()}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function seed(){
  [["Arroz","Mercearia","pct",1],["Feijão","Mercearia","pct",1],["Açúcar","Mercearia","pct",1],["Café","Mercearia","pct",1],["Óleo","Mercearia","garrafa",1],["Leite","Laticínios","L",6],["Ovos","Hortifruti","dz",1],["Pão","Padaria","un",0],["Banana","Hortifruti","kg",0],["Papel higiênico","Higiene","pct",1],["Sabão em pó","Limpeza","cx",1],["Detergente","Limpeza","un",2]]
  .forEach(([n,c,u,m])=>S.items.push({id:uid(),name:n,cat:c,unit:u,price:0,min:m,stock:0}));
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=n=>BRL.format(+n||0);
const num=v=>{if(typeof v==="number")return v;v=String(v||"").replace(/[^\d,.-]/g,"");if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");const n=parseFloat(v);return isNaN(n)?0:n};
const fmtN=n=>(+n||0).toLocaleString("pt-BR",{maximumFractionDigits:3});
const fmtP=n=>(+n||0)?(+n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"";
const dt=t=>new Date(t).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
const dth=t=>new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
const item=id=>S.items.find(i=>i.id===id);
const status=i=>{const s=+i.stock||0,m=+i.min||0;if(m>0&&s<=0)return["Acabou","b-out"];if(s<m)return["Baixo","b-low"];return["OK","b-ok"]};
const needs=i=>(+i.stock||0)<(+i.min||0);
const sortN=(a,b)=>a.name.localeCompare(b.name,"pt-BR");

/* ---------- navegação ---------- */
let view="home",param=null,stack=[];
function go(v,p,push=true){if(push&&(v!==view||p!==param))stack.push([view,param]);view=v;param=p;render();window.scrollTo(0,0)}
function back(){const b=stack.pop();if(b){view=b[0];param=b[1]}else{view="home";param=null}render()}
$("#back").onclick=back;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{stack=[];go(b.dataset.go,null,false)});
const TOP=["home","lists","pantry","items","history"];
function render(){
  const V=VIEWS[view]||VIEWS.home;
  $("#back").hidden=TOP.includes(view);
  $("#hAct").innerHTML="";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.go===view||(view==="list"&&b.dataset.go==="lists")||(view==="purchase"&&b.dataset.go==="history")));
  const r=V();$("#title").textContent=r.title;$("#app").innerHTML=(storageOK?"":`<div class="warn">⚠️ Este navegador não está permitindo salvar dados. Faça backup em Opções antes de fechar.</div>`)+r.html;
  r.after&&r.after();
}
/* ---------- utilitários de UI ---------- */
function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function sheet(html,onMount){const L=$("#layer");L.innerHTML=`<div class="modal"><div class="sheet">${html}</div></div>`;const m=L.firstChild;m.onclick=e=>{if(e.target===m)close()};onMount&&onMount(m);return m}
function close(){stopScan();$("#layer").innerHTML=""}
function ask(msg,okTxt="Confirmar",danger=false){return new Promise(res=>{sheet(`<h3>${esc(msg)}</h3><div class="grid2" style="margin-top:14px"><button class="btn ghost" id="no">Cancelar</button><button class="btn ${danger?"danger":""}" id="yes">${esc(okTxt)}</button></div>`,m=>{m.querySelector("#no").onclick=()=>{close();res(false)};m.querySelector("#yes").onclick=()=>{close();res(true)}})})}
function onAll(sel,ev,fn){document.querySelectorAll(sel).forEach(el=>el.addEventListener(ev,e=>fn(el,e)))}

/* ---------- telas ---------- */
const VIEWS={};
VIEWS.home=()=>{
  const open=S.lists.filter(l=>!l.done);
  const falta=S.items.filter(needs).length;
  const now=new Date(),mes=S.history.filter(h=>{const d=new Date(h.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const gastoMes=mes.reduce((a,h)=>a+h.total,0);
  const last=S.history[0];
  return{title:"🛒 Minha Lista de Mercado",html:`
  <div class="grid2">
    <div class="card" style="margin:0"><div class="mu sm">Gasto no mês</div><div class="stat">${money(gastoMes)}</div><div class="mu sm">${mes.length} compra(s)</div></div>
    <div class="card" style="margin:0"><div class="mu sm">Faltando em casa</div><div class="stat" style="color:${falta?"var(--red)":"var(--g)"}">${falta}</div><div class="mu sm">item(ns)</div></div>
  </div>
  ${installHTML()}
  <div style="margin:14px 0"><button class="btn full" id="nova">＋ Nova lista de compras</button></div>
  ${open.length?`<h2>Listas abertas</h2><div class="list">${open.map(l=>{const t=listTotals(l);return`<div class="li" data-l="${l.id}"><div class="grow"><div class="nm">${esc(l.name)}</div><div class="mu sm">${l.entries.length} itens · ${t.checked}/${l.entries.length} no carrinho</div></div><b>${money(t.est)}</b><span class="mu">›</span></div>`}).join("")}</div>`:""}
  <h2>Opções</h2>
  <div class="grid2">
    <button class="tile" data-go="lists"><span class="i">📝</span><b>Listas</b><span class="mu sm">Montar e ir às compras</span></button>
    <button class="tile" data-go="pantry"><span class="i">🏡</span><b>Em casa</b><span class="mu sm">O que tem e o que falta</span></button>
    <button class="tile" data-go="items"><span class="i">🥫</span><b>Itens</b><span class="mu sm">Cadastro de produtos</span></button>
    <button class="tile" data-go="history"><span class="i">🧾</span><b>Compras</b><span class="mu sm">Histórico e valores</span></button>
    <button class="tile" data-go="settings"><span class="i">⚙️</span><b>Opções</b><span class="mu sm">Backup e categorias</span></button>
    <button class="tile" id="faltaBtn"><span class="i">⚡</span><b>Lista do que falta</b><span class="mu sm">Gerar automática</span></button>
  </div>
  ${last?`<h2>Última compra</h2><div class="list"><div class="li" data-h="${last.id}"><div class="grow"><div class="nm">${esc(last.store||last.listName)}</div><div class="mu sm">${dth(last.date)} · ${last.entries.length} itens</div></div><b>${money(last.total)}</b><span class="mu">›</span></div></div>`:""}
  `,after(){
    $("#nova").onclick=newList;$("#faltaBtn").onclick=listFromMissing;bindInstall();
    onAll("main [data-go]","click",el=>go(el.dataset.go));
    onAll("[data-l]","click",el=>go("list",el.dataset.l));
    onAll("[data-h]","click",el=>go("purchase",el.dataset.h));
  }}
};

/* ----- itens (catálogo) ----- */
let itemQ="",itemCat="";
VIEWS.items=()=>{
  const q=itemQ.toLowerCase();
  const its=S.items.filter(i=>(!q||i.name.toLowerCase().includes(q)||(i.barcode||"").includes(q))&&(!itemCat||i.cat===itemCat)).sort(sortN);
  return{title:"Cadastro de itens",html:`
  <div class="row" style="margin-bottom:10px"><input id="q" placeholder="🔎 Buscar item" value="${esc(itemQ)}"><button class="btn sec" id="scn" style="flex:none" aria-label="Escanear">📷</button><button class="btn" id="add" style="flex:none">＋</button></div>
  <div class="chips"><button class="chip ${!itemCat?"on":""}" data-c="">Todas</button>${S.cats.map(c=>`<button class="chip ${itemCat===c?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  ${its.length?`<div class="list">${its.map(i=>`<div class="li" data-i="${i.id}"><div class="grow"><div class="nm">${esc(i.name)}</div><div class="mu sm">${esc(i.cat)} · ${esc(i.unit)}${i.price?" · "+money(i.price):""}${i.barcode?" · ▮▮ "+esc(i.barcode):""}</div></div><span class="mu">›</span></div>`).join("")}</div>`:`<div class="empty"><span class="i">🥫</span>Nenhum item encontrado.</div>`}
  <div class="mu sm" style="text-align:center;margin-bottom:10px">${S.items.length} itens cadastrados</div>
  <button class="btn sec full" id="sugI">🧺 Adicionar itens sugeridos</button>`,
  after(){
    const qi=$("#q");qi.oninput=()=>{itemQ=qi.value;const p=qi.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
    $("#add").onclick=()=>itemForm(null,itemQ);$("#sugI").onclick=suggestItems;$("#scn").onclick=()=>scan(c=>onScanned(c,{t:"items"}),"Escanear para cadastrar");
    onAll("[data-c]","click",el=>{itemCat=el.dataset.c;render()});
    onAll("[data-i]","click",el=>itemForm(el.dataset.i));
  }}
};
function itemForm(id,preName,cb,preset){
  const base=id?item(id):{name:preName||"",cat:itemCat||S.cats[0],unit:"un",price:0,min:0,stock:0,barcode:""};
  const it={...base,...(preset||{})};
  sheet(`<h3>${id?"Editar item":"Novo item"}</h3>
  ${it.note?`<div class="${it.noteOk?"okbox":"warn"}">${esc(it.note)}</div>`:""}
  <label>Nome</label><input id="f_n" value="${esc(it.name)}" placeholder="Ex.: Arroz 5kg">
  <label>Código de barras</label><div class="row"><input id="f_b" inputmode="numeric" value="${esc(it.barcode||"")}" placeholder="Opcional"><button class="btn sec" id="f_sc" style="flex:none" aria-label="Escanear">📷</button></div>
  <div class="grid2"><div><label>Categoria</label><select id="f_c">${S.cats.map(c=>`<option ${c===it.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
  <div><label>Unidade</label><select id="f_u">${UNITS.map(u=>`<option ${u===it.unit?"selected":""}>${u}</option>`).join("")}</select></div></div>
  <label>Preço de referência (R$)</label><input id="f_p" inputmode="decimal" value="${fmtP(it.price)}" placeholder="0,00">
  <div class="grid2"><div><label>Tenho em casa</label><input id="f_s" inputmode="decimal" value="${fmtN(it.stock)}"></div>
  <div><label>Mínimo em casa</label><input id="f_m" inputmode="decimal" value="${fmtN(it.min)}"></div></div>
  <div class="mu sm" style="margin-top:6px">Quando "tenho em casa" ficar abaixo do mínimo, o item aparece como faltando.</div>
  <div class="grid2" style="margin-top:16px">${id?`<button class="btn danger" id="del">Excluir</button>`:`<button class="btn ghost" id="cancel">Cancelar</button>`}<button class="btn" id="ok">${cb&&!id?"Cadastrar e continuar":"Salvar"}</button></div>`,m=>{
    if(!id&&!it.name)m.querySelector("#f_n").focus();
    const read=()=>({name:m.querySelector("#f_n").value.trim(),barcode:cleanCode(m.querySelector("#f_b").value),cat:m.querySelector("#f_c").value,unit:m.querySelector("#f_u").value,price:num(m.querySelector("#f_p").value),stock:num(m.querySelector("#f_s").value),min:num(m.querySelector("#f_m").value)});
    m.querySelector("#f_sc").onclick=()=>{const cur=read();scan(code=>itemForm(id,null,cb,{...cur,barcode:code}),"Ler código do item")};
    m.querySelector("#cancel")&&(m.querySelector("#cancel").onclick=close);
    m.querySelector("#ok").onclick=()=>{
      const f=read();if(!f.name){toast("Informe o nome");return}
      if(S.items.some(x=>x.name.toLowerCase()===f.name.toLowerCase()&&x.id!==id)){toast("Já existe um item com esse nome");return}
      const dup=f.barcode&&S.items.find(x=>x.barcode===f.barcode&&x.id!==id);if(dup){toast(`Código já usado em "${dup.name}"`);return}
      const target=id?base:{id:uid()};Object.assign(target,f);
      if(!id)S.items.push(target);
      save();close();toast("Item salvo");cb?cb(target):render();
    };
    m.querySelector("#del")&&(m.querySelector("#del").onclick=async()=>{
      if(await ask(`Excluir "${base.name}"? Ele também sai das listas abertas.`,"Excluir",true)){
        S.items=S.items.filter(x=>x.id!==id);S.lists.forEach(l=>{if(!l.done)l.entries=l.entries.filter(e=>e.itemId!==id)});save();toast("Item excluído");render()}
    });
  });
}

/* ----- leitor de código de barras ----- */
const cleanCode=s=>String(s||"").replace(/[^0-9A-Za-z-]/g,"").slice(0,40);
const byCode=c=>c&&S.items.find(i=>i.barcode===c);
function validEAN(c){if(!/^(\d{8}|\d{12,14})$/.test(c))return false;const d=c.split("").map(Number),chk=d.pop();let t=0;d.reverse().forEach((n,i)=>t+=n*(i%2===0?3:1));return (10-t%10)%10===chk}
const SC={stream:null,timer:0,zx:null,last:"",at:0};
function stopScan(){clearTimeout(SC.timer);SC.timer=0;if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}}
function loadZX(){if(window.ZXing)return Promise.resolve();if(SC.zx)return SC.zx;
  SC.zx=new Promise(res=>{const s=document.createElement("script");s.src="zxing.min.js";s.onload=res;s.onerror=()=>{SC.zx=null;res()};document.head.appendChild(s)});return SC.zx}
function beep(){try{navigator.vibrate&&navigator.vibrate(70)}catch(e){}try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=1250;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.09);setTimeout(()=>a.close(),300)}catch(e){}}
function scan(onCode,title="Escanear código de barras"){
  sheet(`<div class="row"><h3 class="grow">${esc(title)}</h3><button class="ic" id="scX" aria-label="Fechar">✕</button></div>
  <div class="scanbox"><video id="scV" playsinline muted autoplay></video><div class="scanframe"></div><div class="scanline"></div></div>
  <div class="mu sm" id="scMsg" style="text-align:center;margin:8px 0">Abrindo a câmera…</div>
  <div class="row"><input id="scM" inputmode="numeric" placeholder="Ou digite o código"><button class="btn" id="scOk" style="flex:none">OK</button></div>
  <button class="btn ghost full" id="scT" style="margin-top:8px" hidden>🔦 Lanterna</button>`,m=>{
    let done=false;const fire=c=>{if(done)return;done=true;SC.last=c;SC.at=Date.now();stopScan();beep();close();onCode(c)};
    m.querySelector("#scX").onclick=close;
    const mi=m.querySelector("#scM");
    m.querySelector("#scOk").onclick=()=>{const c=cleanCode(mi.value);if(c.length<4){toast("Código inválido");return}fire(c)};
    mi.onkeydown=e=>{if(e.key==="Enter")m.querySelector("#scOk").click()};
    startCam(m,fire);
  });
}
async function startCam(m,fire){
  const v=m.querySelector("#scV"),msg=m.querySelector("#scMsg"),say=t=>msg.textContent=t;
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say("Câmera indisponível aqui (abra pelo app instalado). Digite o código.");return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}})}
  catch(e){say("Sem acesso à câmera. Permita o uso da câmera para este app ou digite o código.");return}
  if(!document.body.contains(v)){st.getTracks().forEach(t=>t.stop());return}
  stopScan();SC.stream=st;v.srcObject=st;try{await v.play()}catch(e){}
  if(SC.stream!==st)return;
  const track=st.getVideoTracks()[0],caps=(track.getCapabilities&&track.getCapabilities())||{};
  if(caps.focusMode&&caps.focusMode.includes("continuous"))track.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{});
  if(caps.torch){const b=m.querySelector("#scT");b.hidden=false;let on=false;b.onclick=()=>{on=!on;track.applyConstraints({advanced:[{torch:on}]}).catch(()=>{})}}
  let detect=null;
  if("BarcodeDetector" in window){try{const fm=await BarcodeDetector.getSupportedFormats(),want=["ean_13","ean_8","upc_a","upc_e","code_128","itf"].filter(f=>fm.includes(f));
    if(want.length){const d=new BarcodeDetector({formats:want});detect=async()=>{const r=await d.detect(v);return r.length?r[0].rawValue:null}}}catch(e){}}
  if(!detect){say("Carregando leitor…");await loadZX();
    if(window.ZXing){const Z=window.ZXing,h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.ITF]);h.set(Z.DecodeHintType.TRY_HARDER,true);
      const rd=new Z.MultiFormatReader();rd.setHints(h);const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
      detect=async()=>{const w=v.videoWidth,hh=v.videoHeight;if(!w)return null;const cw=Math.min(w,1000),ch=Math.round(hh*.5*cw/w);cv.width=cw;cv.height=ch;cx.drawImage(v,0,hh*.25,w,hh*.5,0,0,cw,ch);
        try{return rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){return null}finally{rd.reset()}}}}
  if(!detect){say("Leitor indisponível neste aparelho. Digite o código.");return}
  if(SC.stream!==st)return;say("Aponte para o código de barras");
  let last="",n=0;
  const loop=async()=>{if(SC.stream!==st)return;
    if(v.readyState>=2){try{const raw=await detect();const c=cleanCode(raw);
      if(c&&!(c===SC.last&&Date.now()-SC.at<3000)){const ok=validEAN(c);if(c===last)n++;else{last=c;n=1}if((ok&&n>=1)||n>=3){fire(c);return}}}catch(e){}}
    SC.timer=setTimeout(loop,110)};
  loop();
}
const CATMAP=[[/beverage|drink|water|juice|soda|beer|wine|spirit|refrigerante|bebida/,"Bebidas"],[/dair|milk|cheese|yogurt|yoghurt|butter|cream|leite|queijo|iogurte/,"Laticínios"],[/bread|bakery|biscuit|cracker|cake|bolacha|pao|pães/,"Padaria"],[/meat|poultry|chicken|beef|pork|fish|sausage|ham|carne|frango/,"Açougue"],[/frozen|ice-cream|congelad/,"Congelados"],[/fruit|vegetable|fresh|legume|hortali/,"Hortifruti"],[/clean|detergent|laundry|dishwash|household|limpeza|sabao/,"Limpeza"],[/hygiene|shampoo|soap|toothpaste|deodorant|beauty|cosmetic|diaper|toilet-paper|higiene/,"Higiene"]];
function mapCat(tags,host){const t=(tags||[]).join(" ").toLowerCase();let c=null;for(const[re,cat]of CATMAP)if(re.test(t)){c=cat;break}
  if(!c)c=/beauty/.test(host)?"Higiene":/products/.test(host)?"Outros":"Mercearia";return S.cats.includes(c)?c:(S.cats.includes("Outros")?"Outros":S.cats[0])}
async function lookup(code){
  if(!navigator.onLine||!/^\d{8,14}$/.test(code))return null;
  for(const host of ["world.openfoodfacts.org","world.openbeautyfacts.org","world.openproductsfacts.org"]){
    try{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),7000);
      const r=await fetch(`https://${host}/api/v2/product/${code}.json?fields=product_name,product_name_pt,generic_name,brands,quantity,categories_tags`,{signal:ac.signal});clearTimeout(t);
      if(!r.ok)continue;const j=await r.json();if(j.status!==1||!j.product)continue;const p=j.product;
      let nm=String(p.product_name_pt||p.product_name||p.generic_name||"").trim();if(!nm)continue;
      const br=String(p.brands||"").split(",")[0].trim(),q=String(p.quantity||"").trim();
      if(br&&!nm.toLowerCase().includes(br.toLowerCase()))nm+=" "+br;if(q&&!nm.toLowerCase().includes(q.toLowerCase()))nm+=" "+q;
      return{name:nm.replace(/\s+/g," ").slice(0,80),cat:mapCat(p.categories_tags,host)};
    }catch(e){}
  }return null;
}
/* contexto: {t:"list",lid} | {t:"pantry"} | {t:"items"} */
async function onScanned(code,ctx){
  const it=byCode(code);
  if(it){afterFound(it,ctx);return}
  let found=null;
  if(navigator.onLine&&/^\d{8,14}$/.test(code)){sheet(`<div class="empty"><span class="i">🔎</span>Buscando o produto ${esc(code)}…</div>`);found=await lookup(code)}
  const note=found?"✅ Produto encontrado na base online. Confira os dados e salve.":(navigator.onLine?"Produto não encontrado na base online. Preencha o nome para cadastrar.":"Sem internet: preencha o nome para cadastrar. O código já está anotado.");
  const sameName=found&&S.items.find(i=>!i.barcode&&i.name.toLowerCase()===found.name.toLowerCase());
  if(sameName){sameName.barcode=code;save();afterFound(sameName,ctx);return}
  itemForm(null,"",ctx.t==="items"?null:(ni=>afterFound(ni,ctx)),{barcode:code,note,noteOk:!!found,...(found||{})});
}
function afterFound(it,ctx){
  if(ctx.t==="items"){itemForm(it.id);return}
  const again=()=>scan(c=>onScanned(c,ctx),ctx.t==="list"?"Escanear para a lista":"Escanear item de casa");
  if(ctx.t==="pantry"){
    let q=1;sheet(`<h3>${esc(it.name)}</h3><div class="mu">Em casa agora: <b>${fmtN(it.stock)} ${esc(it.unit)}</b></div>
    <label>Quantidade</label><div class="step" style="width:max-content"><button id="m">−</button><input id="q" inputmode="decimal" value="1"><button id="p">+</button></div>
    <div class="grid2" style="margin-top:16px"><button class="btn danger" id="out">➖ Retirar</button><button class="btn" id="in">➕ Guardar</button></div>
    <button class="btn ghost full" id="cl" style="margin-top:10px">Fechar</button>`,m=>{
      const qi=m.querySelector("#q");m.querySelector("#m").onclick=()=>qi.value=fmtN(Math.max(1,num(qi.value)-1));m.querySelector("#p").onclick=()=>qi.value=fmtN(num(qi.value)+1);
      const apply=s=>{q=Math.max(0,num(qi.value))||1;it.stock=Math.max(0,Math.round(((+it.stock||0)+s*q)*1000)/1000);save();close();toast(`${it.name}: ${fmtN(it.stock)} ${it.unit} em casa`);render();again()};
      m.querySelector("#in").onclick=()=>apply(1);m.querySelector("#out").onclick=()=>apply(-1);m.querySelector("#cl").onclick=()=>{close();render()};
    });return;
  }
  const l=S.lists.find(x=>x.id===ctx.lid);if(!l){toast("Lista não encontrada");return}
  const e=l.entries.find(x=>x.itemId===it.id);
  sheet(`<h3>${esc(it.name)}</h3><div class="mu">${e?(e.checked?`Já no carrinho: ${fmtN(e.qty)} ${esc(it.unit)}`:"Está na lista — vai para o carrinho"):"Novo na lista"} · em casa ${fmtN(it.stock)} ${esc(it.unit)}</div>
  <div class="grid2"><div><label>Quantidade</label><div class="step"><button id="m">−</button><input id="q" inputmode="decimal" value="${e&&!e.checked?fmtN(e.qty):1}"><button id="p">+</button></div></div>
  <div><label>Preço unit. (R$)</label><input id="pr" inputmode="decimal" value="${fmtP(e&&e.price||it.price)}" placeholder="0,00"></div></div>
  <div class="grid2" style="margin-top:16px"><button class="btn ghost" id="add1">Adicionar e fechar</button><button class="btn" id="addN">Adicionar e escanear próximo</button></div>`,m=>{
    const qi=m.querySelector("#q");m.querySelector("#m").onclick=()=>qi.value=fmtN(Math.max(1,num(qi.value)-1));m.querySelector("#p").onclick=()=>qi.value=fmtN(num(qi.value)+1);
    const add=()=>{const q=Math.max(0,num(qi.value))||1,pr=num(m.querySelector("#pr").value);
      if(e){e.qty=e.checked?Math.round(((+e.qty||0)+q)*1000)/1000:q;e.checked=true;if(pr)e.price=pr}else l.entries.push({itemId:it.id,qty:q,price:pr||+it.price||0,checked:true});
      save();close();toast(`${it.name} no carrinho`);render()};
    m.querySelector("#add1").onclick=add;m.querySelector("#addN").onclick=()=>{add();again()};
  });
}

  const its=S.items.filter(i=>panF==="all"||needs(i)).sort(sortN);
  const cats=[...new Set(its.map(i=>i.cat))].sort((a,b)=>S.cats.indexOf(a)-S.cats.indexOf(b));

  <div class="chips"><button class="chip ${panF==="all"?"on":""}" data-f="all">Todos (${S.items.length})</button><button class="chip ${panF==="need"?"on":""}" data-f="need">Precisa comprar (${nF})</button></div>

/* ----- listas ----- */
function listTotals(l){let est=0,cart=0,checked=0;l.entries.forEach(e=>{const v=(+e.qty||0)*(+e.price||0);est+=v;if(e.checked){cart+=v;checked++}});return{est,cart,checked}}
function newList(){
  sheet(`<h3>Nova lista</h3><label>Nome da lista</label><input id="ln" value="Compras ${dt(Date.now())}">
  <label>Orçamento (opcional, R$)</label><input id="lb" inputmode="decimal" placeholder="Ex.: 500,00">
  <div class="grid2" style="margin-top:16px"><button class="btn ghost" id="c">Cancelar</button><button class="btn" id="ok">Criar</button></div>`,m=>{
    m.querySelector("#c").onclick=close;
    m.querySelector("#ok").onclick=()=>{const l={id:uid(),name:m.querySelector("#ln").value.trim()||"Compras",budget:num(m.querySelector("#lb").value),created:Date.now(),entries:[],done:false};S.lists.unshift(l);save();close();go("list",l.id);addToList(l.id)};
  });
}
function listFromMissing(){
  const f=S.items.filter(needs);if(!f.length){toast("Nada faltando em casa 👍");return}
  const l={id:uid(),name:"O que falta "+dt(Date.now()),budget:0,created:Date.now(),done:false,entries:f.map(i=>({itemId:i.id,qty:Math.max(1,Math.ceil((+i.min||0)-(+i.stock||0))),price:+i.price||0,checked:false}))};
  S.lists.unshift(l);save();toast(`Lista criada com ${f.length} itens`);go("list",l.id);
}
VIEWS.lists=()=>{
  const open=S.lists.filter(l=>!l.done);
  return{title:"Listas de compras",html:`<button class="btn full" id="nova" style="margin-bottom:12px">＋ Nova lista</button>
  ${open.length?`<div class="list">${open.map(l=>{const t=listTotals(l);return`<div class="li" data-l="${l.id}"><div class="grow"><div class="nm">${esc(l.name)}</div><div class="mu sm">${dt(l.created)} · ${l.entries.length} itens · ${t.checked} no carrinho</div></div><b>${money(t.est)}</b><span class="mu">›</span></div>`}).join("")}</div>`:`<div class="empty"><span class="i">📝</span>Nenhuma lista aberta.<br>Crie uma nova ou gere pelo que falta em casa.</div>`}
  <button class="btn sec full" id="falta">⚡ Gerar lista do que falta em casa</button>`,
  after(){$("#nova").onclick=newList;$("#falta").onclick=listFromMissing;onAll("[data-l]","click",el=>go("list",el.dataset.l))}}
};

function addToList(lid){
  const l=S.lists.find(x=>x.id===lid);let q="";
  const draw=m=>{
    const ql=q.toLowerCase(),inL=new Set(l.entries.map(e=>e.itemId));
    const its=S.items.filter(i=>!ql||i.name.toLowerCase().includes(ql)).sort((a,b)=>(needs(b)-needs(a))||sortN(a,b));
    m.querySelector("#res").innerHTML=(q&&!S.items.some(i=>i.name.toLowerCase()===ql)?`<div class="li" id="quick"><div class="grow"><div class="nm">＋ Cadastrar “${esc(q)}”</div><div class="mu sm">Novo item e adicionar à lista</div></div></div>`:"")+
      its.map(i=>{const on=inL.has(i.id);const[s,cl]=status(i);return`<div class="li" data-a="${i.id}"><div class="grow"><div class="nm">${esc(i.name)}</div><div class="mu sm">${esc(i.cat)} · em casa ${fmtN(i.stock)} ${esc(i.unit)} ${needs(i)?`<span class="badge ${cl}">${s}</span>`:""}</div></div><span class="chk ${on?"on":""}">${on?"✓":""}</span></div>`}).join("");
    m.querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>{const id=el.dataset.a,ix=l.entries.findIndex(e=>e.itemId===id);
      if(ix>=0)l.entries.splice(ix,1);else{const i=item(id);l.entries.push({itemId:id,qty:Math.max(1,Math.ceil((+i.min||0)-(+i.stock||0))),price:+i.price||0,checked:false})}save();draw(m)});
    const qk=m.querySelector("#quick");qk&&(qk.onclick=()=>{const it={id:uid(),name:q.trim(),cat:"Outros",unit:"un",price:0,min:0,stock:0};S.items.push(it);l.entries.push({itemId:it.id,qty:1,price:0,checked:false});save();q="";m.querySelector("#s").value="";draw(m);toast("Item cadastrado e adicionado")});
    m.querySelector("#cnt").textContent=l.entries.length+" na lista";
  };
  sheet(`<div class="row"><h3 class="grow">Adicionar à lista</h3><span class="mu sm" id="cnt"></span></div>
  <input id="s" placeholder="🔎 Buscar ou digitar novo item">
  <div class="list" id="res" style="margin-top:10px"></div>
  <button class="btn full" id="ok">Concluir</button>`,m=>{
    const s=m.querySelector("#s");s.oninput=()=>{q=s.value;draw(m)};
    m.querySelector("#ok").onclick=()=>{close();render()};draw(m);
  });
}
function finish(l){
  const t=listTotals(l),pend=l.entries.length-t.checked;
  sheet(`<h3>Finalizar compra</h3>
  <div class="card"><div class="kv"><span>Itens no carrinho</span><b>${t.checked}</b></div><div class="kv"><span>Total</span><b>${money(t.cart)}</b></div>${pend?`<div class="kv"><span>Não comprados</span><b>${pend}</b></div>`:""}</div>
  <label>Mercado / local (opcional)</label><input id="st" placeholder="Ex.: Supermercado Central">
  <label class="row" style="color:var(--tx)"><input type="checkbox" id="up" checked style="width:22px;height:22px"> Somar ao estoque “Em casa”</label>
  <label class="row" style="color:var(--tx)"><input type="checkbox" id="pr" checked style="width:22px;height:22px"> Atualizar preço de referência dos itens</label>
  ${pend?`<label class="row" style="color:var(--tx)"><input type="checkbox" id="kp" checked style="width:22px;height:22px"> Manter não comprados em uma nova lista</label>`:""}
  <div class="grid2" style="margin-top:16px"><button class="btn ghost" id="c">Voltar</button><button class="btn" id="ok">Concluir</button></div>`,m=>{
    m.querySelector("#c").onclick=close;
    m.querySelector("#ok").onclick=()=>{
      const up=m.querySelector("#up").checked,pr=m.querySelector("#pr").checked,kp=m.querySelector("#kp")?.checked;
      const bought=l.entries.filter(e=>e.checked),left=l.entries.filter(e=>!e.checked);
      const estAll=l.entries.reduce((a,e)=>{const i=item(e.itemId);return a+(+e.qty||0)*(+(i&&i.price)||0)},0);
      const h={id:uid(),date:Date.now(),store:m.querySelector("#st").value.trim(),listName:l.name,budget:l.budget||0,total:t.cart,refTotal:bought.reduce((a,e)=>{const i=item(e.itemId);return a+(+e.qty||0)*(+(i&&i.price)||0)},0),missing:left.length,
        entries:bought.map(e=>{const i=item(e.itemId)||{};return{itemId:e.itemId,name:i.name||"?",cat:i.cat||"Outros",unit:i.unit||"un",qty:+e.qty||0,price:+e.price||0,prev:+i.price||0}})};
      bought.forEach(e=>{const i=item(e.itemId);if(!i)return;if(up)i.stock=Math.round(((+i.stock||0)+(+e.qty||0))*1000)/1000;if(pr&&+e.price)i.price=+e.price});
      S.history.unshift(h);S.lists=S.lists.filter(x=>x.id!==l.id);
      if(kp&&left.length)S.lists.unshift({id:uid(),name:l.name+" (pendentes)",budget:0,created:Date.now(),done:false,entries:left.map(e=>({...e,checked:false}))});
      save();close();stack=[];go("purchase",h.id,false);toast("Compra registrada!");
    };
  });
}

/* ----- histórico / resultado ----- */
let histP="all";
VIEWS.history=()=>{
  const now=Date.now(),D=864e5;
  const f=S.history.filter(h=>histP==="all"||(histP==="30"&&now-h.date<=30*D)||(histP==="m"&&new Date(h.date).getMonth()===new Date().getMonth()&&new Date(h.date).getFullYear()===new Date().getFullYear()));
  const tot=f.reduce((a,h)=>a+h.total,0);
  return{title:"Histórico de compras",html:`
  <div class="chips"><button class="chip ${histP==="m"?"on":""}" data-p="m">Este mês</button><button class="chip ${histP==="30"?"on":""}" data-p="30">30 dias</button><button class="chip ${histP==="all"?"on":""}" data-p="all">Tudo</button></div>
  <div class="grid2" style="margin-bottom:12px"><div class="card" style="margin:0"><div class="mu sm">Total gasto</div><div class="stat">${money(tot)}</div></div><div class="card" style="margin:0"><div class="mu sm">Média por compra</div><div class="stat">${money(f.length?tot/f.length:0)}</div></div></div>
  ${f.length?`<div class="list">${f.map(h=>`<div class="li" data-h="${h.id}"><div class="grow"><div class="nm">${esc(h.store||h.listName)}</div><div class="mu sm">${dth(h.date)} · ${h.entries.length} itens</div></div><b>${money(h.total)}</b><span class="mu">›</span></div>`).join("")}</div>`:`<div class="empty"><span class="i">🧾</span>Nenhuma compra registrada no período.</div>`}`,
  after(){onAll("[data-p]","click",el=>{histP=el.dataset.p;render()});onAll("[data-h]","click",el=>go("purchase",el.dataset.h))}}
};
VIEWS.purchase=()=>{
  const h=S.history.find(x=>x.id===param);if(!h){view="history";return VIEWS.history()}
  const diff=h.refTotal?h.total-h.refTotal:0;
  const byCat={};h.entries.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.qty*e.price);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const qtd=h.entries.reduce((a,e)=>a+(e.unit==="un"?e.qty:1),0);
  return{title:"Resultado da compra",html:`
  <div class="card" style="text-align:center"><div class="mu">${esc(h.store||h.listName)} · ${dth(h.date)}</div><div class="big">${money(h.total)}</div><div class="mu sm">${h.entries.length} produtos</div></div>
  <div class="card">
   ${h.budget?`<div class="kv"><span>Orçamento</span><b>${money(h.budget)}</b></div><div class="kv"><span>${h.budget-h.total>=0?"Sobrou":"Passou"}</span><b class="${h.budget-h.total>=0?"pos":"neg"}">${money(Math.abs(h.budget-h.total))}</b></div>`:""}
   ${h.refTotal?`<div class="kv"><span>Pelos preços de referência</span><b>${money(h.refTotal)}</b></div><div class="kv"><span>${diff>0?"Pagou a mais":"Economizou"}</span><b class="${diff>0?"neg":"pos"}">${money(Math.abs(diff))}</b></div>`:""}
   <div class="kv"><span>Ticket médio por produto</span><b>${money(h.entries.length?h.total/h.entries.length:0)}</b></div>
   ${h.missing?`<div class="kv"><span>Itens não comprados</span><b>${h.missing}</b></div>`:""}
  </div>
  ${cats.length>1?`<h2>Por categoria</h2><div class="card">${cats.map(([c,v])=>`<div class="kv"><span>${esc(c)}</span><b>${money(v)} <span class="mu sm">${h.total?Math.round(v/h.total*100):0}%</span></b></div>`).join("")}</div>`:""}
  <h2>Itens</h2><div class="list">${h.entries.map(e=>{const ch=e.prev&&e.price?e.price-e.prev:0;return`<div class="li"><div class="grow"><div class="nm">${esc(e.name)}</div><div class="mu sm">${fmtN(e.qty)} ${esc(e.unit)} × ${money(e.price)}${ch?` <span class="${ch>0?"neg":"pos"}">${ch>0?"▲":"▼"} ${money(Math.abs(ch))}</span>`:""}</div></div><b>${money(e.qty*e.price)}</b></div>`}).join("")}</div>
  <div class="grid2"><button class="btn sec" id="rep">🔁 Repetir esta lista</button><button class="btn danger" id="del">🗑 Excluir registro</button></div>
  <button class="btn ghost full" id="cp" style="margin-top:10px">📋 Copiar resumo</button>`,
  after(){
    $("#rep").onclick=()=>{const l={id:uid(),name:"Repetir: "+(h.store||h.listName),budget:h.budget||0,created:Date.now(),done:false,entries:h.entries.filter(e=>item(e.itemId)).map(e=>({itemId:e.itemId,qty:e.qty,price:item(e.itemId).price||e.price,checked:false}))};S.lists.unshift(l);save();stack=[];go("list",l.id,false);toast("Lista criada")};
    $("#del").onclick=async()=>{if(await ask("Excluir este registro de compra?","Excluir",true)){S.history=S.history.filter(x=>x.id!==h.id);save();stack=[];go("history",null,false)}};
    $("#cp").onclick=()=>copy(`Compra ${h.store||h.listName} - ${dth(h.date)}\n`+h.entries.map(e=>`${e.name}: ${fmtN(e.qty)} ${e.unit} x ${money(e.price)} = ${money(e.qty*e.price)}`).join("\n")+`\nTOTAL: ${money(h.total)}`);
  }}
};

/* ----- opções ----- */
VIEWS.settings=()=>({title:"Opções",html:`
  <h2>Backup dos dados</h2>
  <div class="card"><div class="mu sm" style="margin-bottom:10px">Seus dados ficam salvos só neste aparelho/navegador. Faça backup de vez em quando ou antes de limpar o navegador ou trocar de celular.</div>
   <div class="grid2"><button class="btn sec" id="exp">⬇️ Salvar backup</button><button class="btn sec" id="cpb">📋 Copiar backup</button></div>
   <div class="grid2" style="margin-top:10px"><button class="btn ghost" id="impf">📂 Restaurar arquivo</button><button class="btn ghost" id="impt">📝 Colar backup</button></div>
   <input type="file" id="file" accept=".json,application/json,text/plain" hidden></div>
  <h2>Itens</h2>
  <div class="card"><div class="mu sm" style="margin-bottom:10px">Os itens iniciais são só exemplos. Você pode cadastrar quantos quiser, ou escolher numa lista pronta com mais de 120 produtos comuns.</div>
   <button class="btn sec full" id="sug">🧺 Adicionar itens sugeridos</button></div>
  <h2>Categorias</h2>
  <div class="list">${S.cats.map((c,i)=>`<div class="li"><div class="grow">${esc(c)}</div><span class="mu sm">${S.items.filter(x=>x.cat===c).length}</span><button class="ic" data-rc="${i}">✕</button></div>`).join("")}</div>
  <div class="row"><input id="nc" placeholder="Nova categoria"><button class="btn" id="addc" style="flex:none">＋</button></div>
  <h2>Resumo</h2>
  <div class="card"><div class="kv"><span>Itens cadastrados</span><b>${S.items.length}</b></div><div class="kv"><span>Listas abertas</span><b>${S.lists.length}</b></div><div class="kv"><span>Compras registradas</span><b>${S.history.length}</b></div><div class="kv"><span>Armazenamento</span><b class="${storageOK?"pos":"neg"}">${storageOK?"Salvando no aparelho":"Indisponível"}</b></div></div>
  <button class="btn danger full" id="reset">Apagar todos os dados</button>
  <div class="mu sm" style="text-align:center;margin-top:16px">Funciona offline · Sem login · Dados não saem do seu aparelho</div>`,
  after(){
    const data=()=>JSON.stringify(S);
    $("#exp").onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data()],{type:"application/json"}));a.download="backup-mercado-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();toast("Backup gerado (se não baixar, use Copiar)")}catch(e){copy(data())}};
    $("#cpb").onclick=()=>copy(data(),"Backup copiado. Cole em um bloco de notas ou WhatsApp para guardar.");
    $("#impf").onclick=()=>$("#file").click();
    $("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(restore)};
    $("#impt").onclick=()=>sheet(`<h3>Colar backup</h3><textarea id="tx" rows="7" placeholder="Cole aqui o texto do backup"></textarea><div class="grid2" style="margin-top:12px"><button class="btn ghost" id="c">Cancelar</button><button class="btn" id="ok">Restaurar</button></div>`,m=>{m.querySelector("#c").onclick=close;m.querySelector("#ok").onclick=()=>{const v=m.querySelector("#tx").value;close();restore(v)}});
    onAll("[data-rc]","click",async el=>{const c=S.cats[+el.dataset.rc];if(S.cats.length<=1)return;if(await ask(`Remover a categoria "${c}"? Os itens dela vão para "Outros".`,"Remover",true)){S.cats.splice(+el.dataset.rc,1);if(!S.cats.includes("Outros"))S.cats.push("Outros");S.items.forEach(i=>{if(i.cat===c)i.cat="Outros"});save();render()}});
    $("#sug").onclick=suggestItems;
    $("#addc").onclick=()=>{const v=$("#nc").value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save();render()}};
    $("#reset").onclick=async()=>{if(await ask("Apagar TODOS os itens, listas e compras? Isso não pode ser desfeito.","Apagar tudo",true)){S=blank();S.seeded=true;save();toast("Dados apagados");stack=[];go("home",null,false)}};
  }});
async function restore(txt){
  try{const d=JSON.parse(txt);if(!d||!Array.isArray(d.items))throw 0;
    if(await ask(`Restaurar backup com ${d.items.length} itens e ${(d.history||[]).length} compras? Os dados atuais serão substituídos.`,"Restaurar")){S=Object.assign(blank(),d,{seeded:true});save();toast("Backup restaurado");stack=[];go("home",null,false)}}
  catch(e){toast("Backup inválido")}
}
function copy(t,msg="Copiado!"){
  const fb=()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();ok?toast(msg):sheet(`<h3>Copie o texto abaixo</h3><textarea rows="8">${esc(t)}</textarea><button class="btn full" style="margin-top:10px" onclick="document.getElementById('layer').innerHTML=''">Fechar</button>`)};
  try{navigator.clipboard.writeText(t).then(()=>toast(msg),fb)}catch(e){fb()}
}
/* ----- PWA ----- */
let deferredPrompt=null;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
function installHTML(){
  if(isStandalone()||localStorage.getItem("mercado.hideInstall"))return"";
  if(deferredPrompt)return`<div class="card row" style="margin-top:12px"><span style="font-size:26px">📲</span><div class="grow"><b>Instalar o app</b><div class="mu sm">Ícone na tela inicial e uso offline</div></div><button class="btn" id="inst" style="flex:none">Instalar</button></div>`;
  if(isIOS)return`<div class="card row" style="margin-top:12px"><span style="font-size:26px">📲</span><div class="grow"><b>Instalar no iPhone</b><div class="mu sm">Toque em Compartilhar ⬆️ e depois em “Adicionar à Tela de Início”.</div></div><button class="ic" id="hideInst">✕</button></div>`;
  return"";
}
function bindInstall(){
  const b=$("#inst");b&&(b.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;render()});
  const h=$("#hideInst");h&&(h.onclick=()=>{try{localStorage.setItem("mercado.hideInstall","1")}catch(e){}render()});
}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(view==="home")render()});
addEventListener("appinstalled",()=>{deferredPrompt=null;toast("App instalado!");if(view==="home")render()});
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
/* ----- catálogo sugerido ----- */
const SUG={
 "Hortifruti":"Alface:un|Tomate:kg|Cebola:kg|Alho:un|Batata:kg|Cenoura:kg|Banana:kg|Maçã:kg|Laranja:kg|Limão:kg|Mamão:un|Abacaxi:un|Melancia:un|Ovos:dz|Abobrinha:kg|Pimentão:kg|Cheiro-verde:un|Batata-doce:kg|Mandioca:kg|Uva:kg",
 "Açougue":"Carne moída:kg|Bife:kg|Frango (peito):kg|Coxa/sobrecoxa:kg|Linguiça:kg|Carne de porco:kg|Peixe:kg|Salsicha:pct|Bacon:pct|Costela:kg",
 "Padaria":"Pão francês:un|Pão de forma:pct|Bolo:un|Bisnaguinha:pct|Torrada:pct|Pão de queijo:pct",
 "Laticínios":"Leite:L|Manteiga:un|Margarina:un|Queijo mussarela:kg|Presunto:kg|Requeijão:un|Iogurte:un|Creme de leite:un|Leite condensado:un|Queijo ralado:pct|Cream cheese:un",
 "Mercearia":"Arroz:pct|Feijão:pct|Açúcar:pct|Sal:pct|Café:pct|Óleo:garrafa|Azeite:garrafa|Macarrão:pct|Farinha de trigo:pct|Farinha de mandioca:pct|Fubá:pct|Molho de tomate:un|Extrato de tomate:un|Milho em conserva:lata|Ervilha:lata|Atum:lata|Sardinha:lata|Maionese:un|Ketchup:un|Mostarda:un|Vinagre:garrafa|Achocolatado:un|Biscoito:pct|Bolacha recheada:pct|Aveia:pct|Granola:pct|Fermento:un|Gelatina:un|Tempero pronto:un|Caldo de carne/galinha:un|Chá:cx|Pipoca:pct|Leite em pó:un|Adoçante:un|Mel:un|Geleia:un",
 "Bebidas":"Água mineral:garrafa|Refrigerante:garrafa|Suco:L|Suco em pó:un|Cerveja:lata|Água com gás:garrafa|Energético:lata",
 "Limpeza":"Detergente:un|Sabão em pó:cx|Sabão líquido:un|Amaciante:un|Água sanitária:un|Desinfetante:un|Limpador multiuso:un|Esponja:pct|Saco de lixo:pct|Papel toalha:pct|Álcool:un|Lustra-móveis:un|Palha de aço:pct|Pano de chão:un|Inseticida:un|Sabão em barra:pct",
 "Higiene":"Papel higiênico:pct|Sabonete:un|Shampoo:un|Condicionador:un|Creme dental:un|Escova de dentes:un|Desodorante:un|Fio dental:un|Absorvente:pct|Algodão:pct|Cotonete:cx|Barbeador:un|Fralda:pct|Lenço umedecido:pct|Protetor solar:un",
 "Congelados":"Pizza congelada:un|Lasanha congelada:un|Hambúrguer:cx|Nuggets:pct|Batata congelada:pct|Sorvete:un|Polpa de fruta:pct|Pão de queijo congelado:pct",
 "Outros":"Ração para pet:pct|Areia para gato:pct|Pilhas:un|Lâmpada:un|Velas:pct|Fósforo:cx|Filme plástico:un|Papel alumínio:un|Guardanapo:pct|Copos descartáveis:pct"
};
function suggestItems(){
  const have=new Set(S.items.map(i=>i.name.toLowerCase()));
  const groups=Object.entries(SUG).map(([c,str])=>[c,str.split("|").map(x=>x.split(":")).filter(([n])=>!have.has(n.toLowerCase()))]).filter(g=>g[1].length);
  if(!groups.length){toast("Você já tem todos os itens sugeridos");return}
  const sel=new Set();
  sheet(`<div class="row"><h3 class="grow">Itens sugeridos</h3><button class="ic" id="x">✕</button></div>
  <div class="mu sm">Toque para marcar. Os itens entram com mínimo 0 (não aparecem como faltando até você definir o mínimo).</div>
  ${groups.map(([c,its],gi)=>`<div class="row" style="margin-top:12px"><div class="catH grow" style="margin:0">${esc(c)}</div><button class="chip" data-all="${gi}">Todos</button></div>
   <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${its.map(([n,u])=>`<button class="chip" data-g="${gi}" data-n="${esc(n)}" data-u="${u}" data-c="${esc(c)}">${esc(n)}</button>`).join("")}</div>`).join("")}
  <div style="position:sticky;bottom:0;background:var(--bg);padding-top:12px"><button class="btn full" id="ok">Adicionar (0)</button></div>`,m=>{
    const upd=()=>m.querySelector("#ok").textContent=`Adicionar (${sel.size})`;
    const tog=(b,on)=>{on=on??!b.classList.contains("on");b.classList.toggle("on",on);on?sel.add(b):sel.delete(b)};
    m.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{tog(b);upd()});
    m.querySelectorAll("[data-all]").forEach(a=>a.onclick=()=>{const bs=[...m.querySelectorAll(`[data-g="${a.dataset.all}"]`)],on=!bs.every(b=>b.classList.contains("on"));bs.forEach(b=>tog(b,on));upd()});
    m.querySelector("#x").onclick=close;
    m.querySelector("#ok").onclick=()=>{if(!sel.size){toast("Marque ao menos um item");return}
      sel.forEach(b=>{const c=S.cats.includes(b.dataset.c)?b.dataset.c:(S.cats.includes("Outros")?"Outros":S.cats[0]);S.items.push({id:uid(),name:b.dataset.n,cat:c,unit:b.dataset.u,price:0,min:0,stock:0,barcode:""})});
      save();close();toast(`${sel.size} itens adicionados`);render()};
  });
}

/* ----- botão voltar do celular ----- */
let armed=false;
function armBack(){if(armed)return;try{history.pushState({guard:1},"");armed=true}catch(e){}}
function exitDialog(){
  sheet(`<div style="text-align:center"><span style="font-size:34px">🚪</span><h3>Gostaria de sair do app?</h3><div class="mu sm">Toque em voltar de novo também sai.</div></div>
  <div class="grid2" style="margin-top:14px"><button class="btn ghost" id="no">Não</button><button class="btn" id="yes">Sim</button></div>`,m=>{
    m.dataset.exit="1";
    const stay=()=>{close();armBack()};
    m.querySelector("#no").onclick=stay;m.onclick=e=>{if(e.target===m)stay()};
    m.querySelector("#yes").onclick=()=>{close();try{window.close()}catch(e){}
      setTimeout(()=>{if(!document.hidden)toast("Toque em voltar para fechar o app")},300)};
  });
}
addEventListener("popstate",()=>{
  armed=false;
  const m=$("#layer").firstChild;
  if(m){close();armBack();return}                 // fecha janela/scanner aberto
  if(view!=="home"||stack.length){back();armBack();return} // volta uma tela
  exitDialog();                                    // na tela inicial: pergunta se quer sair (sem guarda: 2º voltar fecha)
});
try{history.replaceState({root:1},"")}catch(e){}
armBack();
addEventListener("pointerdown",()=>{if(!armed&&!$("#layer [data-exit]"))armBack()},true);
load();render();
</script>
