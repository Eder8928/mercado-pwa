<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://firestore.googleapis.com https://*.firebaseio.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1E40">
<meta name="author" content="Eder Rodrigues — LIVREZON TECNOLOGIA">
<link rel="icon" href="livrezon-selo-96.png">
<title>Painel Master · Minha Lista de Mercado</title>
<script src="firebase-config.js"></script>
<style>
:root{--navy:#0B1E40;--navy2:#061430;--au:#D4A02A;--au2:#F2C861;--bg:#061430;--card:#0f2140;--tx:#eef2f9;--mu:#9fb0cc;--bd:#22355a;--red:#ff6b61;--ok:#4cc184}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);border-bottom:3px solid var(--au);padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{width:42px;height:42px;border-radius:50%}
header h1{margin:0;font-size:18px;flex:1}header h1 small{display:block;color:var(--au2);font-weight:500;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px;color:var(--au2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--navy2);border:1px solid var(--bd);border-radius:12px;padding:12px}.kpi b{display:block;font-size:26px;color:var(--au2)}.kpi span{color:var(--mu);font-size:13px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;background:var(--au);color:var(--navy2);cursor:pointer}
.btn.sec{background:#1b2a47;color:var(--tx);border:1px solid var(--bd)}.btn.dan{background:#3a1d1b;color:var(--red);border:1px solid #6b2c27}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--navy2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:14px}
label{display:block;color:var(--mu);font-size:13px;margin:10px 0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:180px}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--red)}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:#1b2a47}
.center{min-height:70vh;display:flex;align-items:center;justify-content:center}
.login{max-width:420px;text-align:center}.login img{width:120px;border-radius:50%;box-shadow:0 0 0 3px var(--au)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .card{max-width:640px;width:100%;max-height:88vh;overflow:auto;margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:10px;z-index:30}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#1b2a47;color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:8px 14px;cursor:pointer}.tabs button.on{background:var(--au);color:var(--navy2);border-color:var(--au)}
footer{text-align:center;color:var(--mu);font-size:12.5px;padding:24px}
code{background:var(--navy2);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<header><img src="livrezon-selo-96.png" alt="LIVREZON TECNOLOGIA"><h1>Painel Master<small>Minha Lista de Mercado · LIVREZON TECNOLOGIA</small></h1><span id="who" class="mu"></span><button class="btn sec" id="out" hidden>Sair</button></header>
<main id="app"><div class="center"><div class="mu">Carregando…</div></div></main>
<footer>Acesso restrito · Todas as ações ficam registradas no log de auditoria imutável.<br>Desenvolvido por Eder Rodrigues — LIVREZON TECNOLOGIA</footer>
<div id="layer"></div>
<script type="module">
if(window.top!==window.self){document.documentElement.innerHTML="";throw new Error("framed")}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ms=t=>t&&t.toMillis?t.toMillis():(typeof t==="number"?t:0);
const dth=t=>{const v=ms(t);return v?new Date(v).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"-"};
const BRL=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(html,mount){$("#layer").innerHTML=`<div class="modal"><div class="card">${html}</div></div>`;const m=$("#layer").firstChild;m.onclick=e=>{if(e.target===m)close()};mount&&mount(m);return m}
function close(){$("#layer").innerHTML=""}
function askReason(title,okTxt="Confirmar",danger=false){return new Promise(res=>modal(`<h2>${esc(title)}</h2><label>Motivo (obrigatório, fica no log de auditoria)</label><textarea id="rs" rows="3" maxlength="300"></textarea>
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn sec" id="c">Cancelar</button><button class="btn ${danger?"dan":""}" id="ok">${esc(okTxt)}</button></div>`,m=>{
  m.querySelector("#c").onclick=()=>{close();res(null)};m.querySelector("#ok").onclick=()=>{const r=m.querySelector("#rs").value.trim();if(r.length<3){toast("Informe o motivo");return}close();res(r)}}))}

if(!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey)){$("#app").innerHTML=`<div class="center"><div class="card login"><h2>Firebase não configurado</h2><p class="mu">Preencha <code>firebase-config.js</code>.</p></div></div>`;throw new Error("sem config")}
const F=await import("./fb.js");
const app=F.initializeApp(window.FIREBASE_CONFIG);
const db=F.initializeFirestore(app,{});
const auth=F.getAuth(app);
const MASTERS=(window.MASTER_EMAILS||[]).map(e=>e.toLowerCase());
let user=null;

async function audit(action,target,reason,details){
  await F.addDoc(F.collection(db,"audit"),{at:F.serverTimestamp(),email:user.email,action,target:String(target||""),reason,details:details?String(details).slice(0,500):""});
}

function loginView(msg){
  $("#who").textContent="";$("#out").hidden=true;
  $("#app").innerHTML=`<div class="center"><div class="card login"><img src="livrezon-selo-192.png" alt=""><h2 style="margin-top:14px">Acesso Master</h2>
  <p class="mu">Entre com a conta Google autorizada. Use uma conta com verificação em duas etapas (chave de segurança/passkey) ativada.</p>
  ${msg?`<p class="bad">${esc(msg)}</p>`:""}<button class="btn" id="g" style="width:100%">Entrar com Google</button></div></div>`;
  $("#g").onclick=async()=>{try{await F.signInWithPopup(auth,new F.GoogleAuthProvider())}catch(e){loginView("Não foi possível entrar: "+(e.code||e.message))}};
}
$("#out").onclick=()=>F.signOut(auth);

F.onAuthStateChanged(auth,async u=>{
  user=u;
  if(!u||u.isAnonymous){loginView();return}
  if(MASTERS.length&&!MASTERS.includes((u.email||"").toLowerCase())){await F.signOut(auth);loginView("Conta sem permissão de Acesso Master.");return}
  $("#who").textContent=u.email;$("#out").hidden=false;
  try{await F.getDocs(F.query(F.collection(db,"audit"),F.limit(1)))}catch(e){await F.signOut(auth);loginView("Conta sem permissão de Acesso Master (bloqueada pelas regras do banco).");return}
  shell();
});

let tab="geral";
function shell(){
  $("#app").innerHTML=`<div class="tabs">${[["geral","📊 Visão geral"],["contas","⭐ Contas e Premium"],["listas","🗂️ Listas"],["config","🛠️ Manutenção"],["backup","💾 Master Backup"],["audit","📜 Auditoria"]].map(([k,t])=>`<button data-t="${k}" class="${tab===k?"on":""}">${t}</button>`).join("")}</div><div id="tab"></div>`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});
  ({geral,contas,listas,config,backup,auditView})[tab==="audit"?"auditView":tab]();
}
const lists=()=>F.collection(db,"lists");
async function count(q){try{return (await F.getCountFromServer(q)).data().count}catch(e){return "?"}}

async function geral(){
  $("#tab").innerHTML=`<div class="card"><h2>Uso das listas compartilhadas</h2><div class="grid" id="k"><div class="mu">Calculando…</div></div></div>
  <div class="card"><h2>Saúde do sistema</h2><div id="h" class="mu">Verificando…</div></div>
  <div class="card"><h2>Retenção (LGPD)</h2><p class="mu" style="margin-top:-6px">Apaga as listas cujo prazo de retenção (expireAt) já passou. Use se a política de TTL do Firestore não estiver ativa.</p><button class="btn sec" id="clean">🧹 Limpar listas expiradas</button></div>`;
  $("#clean").onclick=async()=>{const q=await F.getDocs(F.query(lists(),F.where("expireAt","<",F.Timestamp.fromMillis(Date.now())),F.limit(300)));if(q.empty){toast("Nenhuma lista expirada");return}
    const r=await askReason(`Excluir ${q.size} lista(s) expirada(s)`,"Excluir",true);if(!r)return;
    try{await audit("cleanup_expired","lists",r,`${q.size} listas`);for(const d of q.docs)await F.deleteDoc(d.ref||F.doc(db,"lists",d.id));toast(`${q.size} lista(s) excluída(s)`);geral()}catch(e){toast("Falha: "+(e.code||e.message))}};
  const now=Date.now(),T=F.Timestamp.fromMillis;
  const t0=performance.now();
  const [all,d1,d7,done]=await Promise.all([count(lists()),count(F.query(lists(),F.where("updatedAt",">=",T(now-864e5)))),count(F.query(lists(),F.where("updatedAt",">=",T(now-7*864e5)))),count(F.query(lists(),F.where("done","==",true)))]);
  const lat=Math.round(performance.now()-t0);
  $("#k").innerHTML=[["Listas na nuvem",all],["Ativas (24h)",d1],["Ativas (7 dias)",d7],["Compras finalizadas",done]].map(([t,v])=>`<div class="kpi"><b>${v}</b><span>${t}</span></div>`).join("");
  let cfg={};try{const c=await F.getDoc(F.doc(db,"config","app"));cfg=c.exists()?c.data():{}}catch(e){}
  $("#h").innerHTML=`<table><tr><td>Banco (Firestore)</td><td class="ok">● online · ${lat} ms</td></tr><tr><td>Projeto</td><td>${esc(window.FIREBASE_CONFIG.projectId)}</td></tr>
   <tr><td>Modo manutenção</td><td>${cfg.maintenance?'<span class="bad">ATIVO</span>':'<span class="ok">desligado</span>'}</td></tr><tr><td>Versão mínima exigida</td><td>${esc(cfg.minVersion||"-")}</td></tr>
   <tr><td>Aviso global</td><td>${esc(cfg.message||"-")}</td></tr></table>`;
}

let lastLists=[];
async function listas(){
  $("#tab").innerHTML=`<div class="card"><h2>Buscar lista por código</h2><div class="row"><input id="code" class="grow" placeholder="Código ou link de convite"><button class="btn" id="go">Buscar</button></div></div>
  <div class="card"><h2>Listas recentes</h2><p class="mu" style="margin-top:-6px">Somente metadados. O conteúdo só é aberto com motivo registrado (suporte/LGPD).</p><div id="tb" class="mu">Carregando…</div></div>`;
  $("#go").onclick=async()=>{const v=$("#code").value.trim(),id=(v.match(/#j-([A-Za-z0-9]{20,40})/)||[])[1]||v;if(!/^[A-Za-z0-9]{20,40}$/.test(id)){toast("Código inválido");return}
    const s=await F.getDoc(F.doc(db,"lists",id));if(!s.exists()){toast("Lista não encontrada");return}renderRows([{id:s.id,...s.data()}],"Resultado da busca")};
  const q=await F.getDocs(F.query(lists(),F.orderBy("updatedAt","desc"),F.limit(50)));
  lastLists=q.docs.map(d=>({id:d.id,...d.data()}));renderRows(lastLists);
}
function renderRows(rows,title){
  const el=$("#tb");if(title)el.previousElementSibling.previousElementSibling.textContent=title;
  if(!rows.length){el.innerHTML="Nenhuma lista na nuvem.";return}
  el.innerHTML=`<div style="overflow:auto"><table><tr><th>Código</th><th>Itens</th><th>Status</th><th>Atualizada</th><th>Expira</th><th></th></tr>${rows.map(r=>`<tr>
    <td><code>${esc(r.id.slice(0,6))}…</code></td><td>${Object.keys(r.entries||{}).length}</td><td>${r.done?'<span class="tag">finalizada</span>':'<span class="tag ok">aberta</span>'}</td>
    <td>${dth(r.updatedAt)}</td><td>${dth(r.expireAt)}</td>
    <td class="row" style="flex-wrap:nowrap"><button class="btn sec" data-o="${esc(r.id)}">Abrir</button><button class="btn dan" data-d="${esc(r.id)}">Excluir</button></td></tr>`).join("")}</table></div>`;
  el.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>openList(b.dataset.o));
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>delList(b.dataset.d));
}
async function openList(id){
  const r=await askReason("Abrir conteúdo da lista (suporte/LGPD)","Abrir");if(!r)return;
  try{await audit("open_list",id,r);const s=await F.getDoc(F.doc(db,"lists",id));if(!s.exists()){toast("Lista não encontrada");return}const d=s.data(),e=Object.values(d.entries||{});
    modal(`<h2>${esc(d.name)}</h2><p class="mu">Código <code>${esc(id)}</code> · ${e.length} itens · ${d.done?"finalizada "+BRL(d.total):"aberta"}</p>
    <table><tr><th>Item</th><th>Qtd</th><th>Preço</th><th>Carrinho</th></tr>${e.map(x=>`<tr><td>${esc(x.n)}</td><td>${esc(x.q)} ${esc(x.u)}</td><td>${BRL(x.p)}</td><td>${x.ck?"✓ "+esc(x.by||""):""}</td></tr>`).join("")}</table>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn sec" id="x">Fechar</button></div>`,m=>m.querySelector("#x").onclick=close);
  }catch(e){toast("Falha: "+(e.code||e.message))}
}
async function delList(id){
  const r=await askReason("Excluir lista da nuvem (definitivo)","Excluir",true);if(!r)return;
  try{await audit("delete_list",id,r);await F.deleteDoc(F.doc(db,"lists",id));toast("Lista excluída");listas()}catch(e){toast("Falha: "+(e.code||e.message))}
}

async function config(){
  let c={};try{const s=await F.getDoc(F.doc(db,"config","app"));c=s.exists()?s.data():{}}catch(e){}
  $("#tab").innerHTML=`<div class="card"><h2>Manutenção, avisos e atualização</h2>
  <label class="row" style="color:var(--tx)"><input type="checkbox" id="mt" style="width:20px;height:20px" ${c.maintenance?"checked":""}> Modo manutenção (bloqueia compartilhar/entrar em listas; o uso local continua)</label>
  <label>Aviso exibido no início do app (vazio = sem aviso)</label><input id="msg" maxlength="200" value="${esc(c.message||"")}">
  <label>Versão mínima (abaixo dela o app mostra “Atualizar agora”). Versão atual publicada: <b>${esc(window.APP_VERSION_PUBLISHED||"2.0.0")}</b></label><input id="mv" placeholder="ex.: 2.0.0" value="${esc(c.minVersion||"")}">
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="sv">Salvar</button></div></div>`;
  $("#sv").onclick=async()=>{const n={maintenance:$("#mt").checked,message:$("#msg").value.trim(),minVersion:$("#mv").value.trim(),updatedAt:F.serverTimestamp(),updatedBy:user.email};
    if(n.minVersion&&!/^\d+\.\d+\.\d+$/.test(n.minVersion)){toast("Versão no formato 1.2.3");return}
    const r=await askReason("Salvar configuração do app","Salvar");if(!r)return;
    try{await audit("config",`app`,r,JSON.stringify({maintenance:n.maintenance,message:n.message,minVersion:n.minVersion}));await F.setDoc(F.doc(db,"config","app"),n);toast("Configuração salva")}catch(e){toast("Falha: "+(e.code||e.message))}};
}

async function contas(){
  const H=F.collection(db,"households");
  $("#tab").innerHTML=`<div class="card"><h2>Contas Google</h2><div class="grid" id="ck"><div class="mu">Calculando…</div></div></div>
  <div class="card"><h2>Buscar conta por e-mail</h2><div class="row"><input id="em" class="grow" type="email" placeholder="email@gmail.com"><button class="btn" id="bs">Buscar</button></div><div id="cr" style="margin-top:12px"></div></div>`;
  const [u,h,p]=await Promise.all([count(F.collection(db,"users")),count(H),count(F.query(H,F.where("plan","==","premium")))]);
  $("#ck").innerHTML=[["Contas",u],["Famílias",h],["Premium (registro)",p]].map(([t,v])=>`<div class="kpi"><b>${v}</b><span>${t}</span></div>`).join("");
  $("#bs").onclick=async()=>{const em=$("#em").value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast("E-mail inválido");return}
    try{const q=await F.getDocs(F.query(F.collection(db,"users"),F.where("email","==",em),F.limit(5)));
      if(q.empty){$("#cr").innerHTML='<p class="mu">Nenhuma conta com esse e-mail.</p>';return}
      const rows=[];for(const d of q.docs){const ud=d.data(),hid=ud.householdId||d.id;let hd=null;try{const x=await F.getDoc(F.doc(db,"households",hid));hd=x.exists()?x.data():null}catch(e){}rows.push({uid:d.id,ud,hid,hd})}
      $("#cr").innerHTML=rows.map(r=>{const prem=r.hd&&r.hd.plan==="premium"&&ms(r.hd.planUntil)>Date.now();return`<div class="card" style="background:var(--navy2)">
        <div><b>${esc(r.ud.email)}</b> <span class="tag">${r.hd&&r.hd.ownerUid===r.uid?"dono da família":"membro"}</span></div>
        <div class="mu">Família: ${esc(r.hd?r.hd.name:"—")} · ${r.hd?Object.keys(r.hd.members||{}).length:0} pessoa(s) · Plano: ${prem?'<span class="ok">Premium até '+dth(r.hd.planUntil)+'</span>':"Grátis"}${r.hd&&r.hd.planSource?" ("+esc(r.hd.planSource)+")":""}</div>
        <div class="row" style="margin-top:10px">${r.hd?`<select data-m="${esc(r.hid)}" style="width:auto"><option value="1">1 mês</option><option value="3">3 meses</option><option value="12">12 meses</option></select><button class="btn" data-g="${esc(r.hid)}">Conceder Premium</button><button class="btn dan" data-r="${esc(r.hid)}">Remover Premium</button>`:""}</div></div>`}).join("");
      document.querySelectorAll("[data-g]").forEach(b=>b.onclick=async()=>{const hid=b.dataset.g,mo=+document.querySelector(`[data-m="${CSS.escape(hid)}"]`).value;
        const r=await askReason(`Conceder Premium por ${mo} mês(es)`,"Conceder");if(!r)return;
        try{await audit("grant_premium",hid,r,mo+" mes(es)");await F.updateDoc(F.doc(db,"households",hid),{plan:"premium",planUntil:F.Timestamp.fromMillis(Date.now()+mo*30*864e5),planSource:"master"});toast("Premium concedido");$("#bs").click()}catch(e){toast("Falha: "+(e.code||e.message))}});
      document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{const hid=b.dataset.r;const r=await askReason("Remover Premium","Remover",true);if(!r)return;
        try{await audit("revoke_premium",hid,r);await F.updateDoc(F.doc(db,"households",hid),{plan:"free",planUntil:F.Timestamp.fromMillis(Date.now()),planSource:"master"});toast("Premium removido");$("#bs").click()}catch(e){toast("Falha: "+(e.code||e.message))}});
    }catch(e){toast("Falha: "+(e.code||e.message))}};
}

/* Master Backup: AES-256-GCM, chave derivada da senha (PBKDF2-SHA256, 310.000 iterações) */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pass,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
const plain=v=>v&&v.toMillis?{__ts:v.toMillis()}:Array.isArray(v)?v.map(plain):(v&&typeof v==="object")?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,plain(x)])):v;
const revive=v=>v&&typeof v==="object"&&!Array.isArray(v)?("__ts" in v&&Object.keys(v).length===1?F.Timestamp.fromMillis(v.__ts):Object.fromEntries(Object.entries(v).map(([k,x])=>[k,revive(x)]))):v;
function backup(){
  $("#tab").innerHTML=`<div class="card"><h2>Gerar Master Backup</h2><p class="mu">Exporta listas compartilhadas, contas, famílias (itens, histórico, categorias) e a configuração, criptografado com AES-256. Guarde a senha no seu gerenciador de senhas: sem ela não há como restaurar.</p>
  <label>Senha do backup (mín. 12 caracteres)</label><input id="p1" type="password" autocomplete="new-password"><label>Repita a senha</label><input id="p2" type="password" autocomplete="new-password">
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="mk">Gerar e baixar</button></div></div>
  <div class="card"><h2>Restaurar Master Backup</h2><p class="mu">Restauração total ou de uma lista específica.</p>
  <input type="file" id="f" accept=".lzbak,application/json"><label>Senha do backup</label><input id="p3" type="password" autocomplete="off">
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn sec" id="rd">Abrir backup</button></div><div id="rres"></div></div>`;
  $("#mk").onclick=async()=>{const p=$("#p1").value;if(p.length<12){toast("Senha com 12+ caracteres");return}if(p!==$("#p2").value){toast("As senhas não conferem");return}
    const r=await askReason("Gerar Master Backup","Gerar");if(!r)return;
    try{const q=await F.getDocs(lists()),c=await F.getDoc(F.doc(db,"config","app"));
      const data={app:"Minha Lista de Mercado",by:"LIVREZON TECNOLOGIA",exportedAt:Date.now(),exportedBy:user.email,project:window.FIREBASE_CONFIG.projectId,config:c.exists()?plain(c.data()):null,lists:q.docs.map(d=>({id:d.id,data:plain(d.data())}))};
      const hs=await F.getDocs(F.collection(db,"households"));data.households=[];
      for(const h of hs.docs){const sub={};for(const c of ["items","history","meta"]){const x=await F.getDocs(F.collection(db,"households",h.id,c));sub[c]=x.docs.map(d=>({id:d.id,data:plain(d.data())}))}data.households.push({id:h.id,data:plain(h.data()),...sub})}
      const us=await F.getDocs(F.collection(db,"users"));data.users=us.docs.map(d=>({id:d.id,data:plain(d.data())}));
      const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await key(p,salt);
      const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(JSON.stringify(data)));
      const out=JSON.stringify({format:"lzbak",v:1,alg:"AES-256-GCM",kdf:"PBKDF2-SHA256",iter:310000,salt:b64(salt),iv:b64(iv),count:data.lists.length,exportedAt:data.exportedAt,data:b64(ct)});
      await audit("backup","all",r,`${data.lists.length} listas, ${data.households.length} famílias`);
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"application/json"}));a.download=`master-backup-mercado-${new Date().toISOString().slice(0,10)}.lzbak`;document.body.appendChild(a);a.click();a.remove();
      toast(`Backup gerado: ${data.lists.length} listas`);
    }catch(e){toast("Falha: "+(e.code||e.message))}};
  $("#rd").onclick=async()=>{const f=$("#f").files[0];if(!f){toast("Escolha o arquivo");return}
    try{const j=JSON.parse(await f.text());if(j.format!=="lzbak")throw new Error("formato");const k=await key($("#p3").value,ub64(j.salt));
      const data=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(j.iv)},k,ub64(j.data))));
      $("#rres").innerHTML=`<p class="ok">Backup de ${dth(data.exportedAt)} · ${data.lists.length} listas · ${(data.households||[]).length} famílias · por ${esc(data.exportedBy)}</p>
      <div class="row"><button class="btn dan" id="ra">Restaurar tudo</button><input id="one" class="grow" placeholder="ou código de uma lista"><button class="btn sec" id="r1">Restaurar esta</button></div>`;
      const put=async items=>{for(const it of items)await F.setDoc(F.doc(db,"lists",it.id),revive(it.data))};
      $("#ra").onclick=async()=>{const r=await askReason(`Restaurar TODAS as ${data.lists.length} listas (sobrescreve as atuais com o mesmo código)`,"Restaurar",true);if(!r)return;
        try{await audit("restore","all",r,`${data.lists.length} listas, ${(data.households||[]).length} famílias`);await put(data.lists);
          for(const h of (data.households||[])){await F.setDoc(F.doc(db,"households",h.id),revive(h.data));for(const c of ["items","history","meta"])for(const d of (h[c]||[]))await F.setDoc(F.doc(db,"households",h.id,c,d.id),revive(d.data))}
          for(const u of (data.users||[]))await F.setDoc(F.doc(db,"users",u.id),revive(u.data));if(data.config)await F.setDoc(F.doc(db,"config","app"),revive(data.config));toast("Restauração concluída")}catch(e){toast("Falha: "+(e.code||e.message))}};
      $("#r1").onclick=async()=>{const id=$("#one").value.trim(),it=data.lists.find(x=>x.id===id);if(!it){toast("Código não está no backup");return}
        const r=await askReason("Restaurar a lista "+id.slice(0,6)+"…","Restaurar",true);if(!r)return;
        try{await audit("restore",id,r);await put([it]);toast("Lista restaurada")}catch(e){toast("Falha: "+(e.code||e.message))}};
    }catch(e){toast("Não foi possível abrir: senha incorreta ou arquivo inválido")}};
}

async function auditView(){
  $("#tab").innerHTML=`<div class="card"><h2>Log de auditoria (imutável)</h2><div id="al" class="mu">Carregando…</div></div>`;
  try{const q=await F.getDocs(F.query(F.collection(db,"audit"),F.orderBy("at","desc"),F.limit(100)));
    $("#al").innerHTML=q.empty?"Nenhuma ação registrada.":`<div style="overflow:auto"><table><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Alvo</th><th>Motivo</th></tr>${q.docs.map(d=>{const a=d.data();return`<tr><td>${dth(a.at)}</td><td>${esc(a.email)}</td><td><span class="tag">${esc(a.action)}</span></td><td><code>${esc(String(a.target).slice(0,8))}</code></td><td>${esc(a.reason)}${a.details?`<div class="mu">${esc(a.details)}</div>`:""}</td></tr>`}).join("")}</table></div>`;
  }catch(e){$("#al").textContent="Falha: "+(e.code||e.message)}
}
</script>
</body>
</html>
